:root{color-scheme:dark;--bg:#111210;--panel:#191b18;--line:#30332b;--text:#f1eee5;--muted:#999e90;--amber:#e9b76a;--green:#99b997}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Manrope,Arial,sans-serif}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.4}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:4px}button{color:inherit;background:none;border:1px solid var(--line);padding:12px 18px;transition:transform .2s,border-color .2s,background .2s}button:hover:not(:disabled){border-color:var(--amber);transform:translateY(-2px)}button:active:not(:disabled){transform:scale(.98)}.primary{background:var(--amber);color:#201b12;border-color:var(--amber);font-weight:800}.small{padding:8px 12px;font-size:12px}.label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.muted{color:var(--muted)}.brand{font-weight:800;letter-spacing:3px;font-size:16px}.brand i{font-style:normal;color:var(--amber)}nav{max-width:1400px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:22px 5%;border-bottom:1px solid var(--line);gap:20px}nav .links{display:flex;gap:24px;align-items:center}nav a{font-size:12px;color:var(--muted)}nav a.active{color:var(--amber)}.demo{font-size:9px;letter-spacing:1px;border:1px solid var(--line);padding:5px 7px;color:var(--muted)}main{max-width:1400px;margin:auto;padding:0 5% 60px}.view{animation:enter .4s ease}.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:50px;min-height:690px}.eyebrow{display:flex;align-items:center;gap:12px;color:var(--amber);font-size:10px;letter-spacing:2px}.dot{width:6px;height:6px;background:var(--green);display:inline-block;border-radius:50%;box-shadow:0 0 12px #99b99755}h1{font-size:clamp(42px,5.2vw,76px);font-weight:500;letter-spacing:-4px;line-height:1.08;margin:28px 0}h1 em{font-style:normal;color:var(--amber)}h2{font-size:34px;letter-spacing:-1.4px;font-weight:500;margin:12px 0 24px}h3{font-size:18px;font-weight:500;margin:0 0 12px}p{line-height:1.8}.hero p{max-width:420px;font-size:15px;color:var(--muted)}.actions{display:flex;gap:12px;margin:30px 0;flex-wrap:wrap}.proof{display:flex;gap:25px;padding-top:24px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.floorwrap{position:relative;border:1px solid var(--line);background:linear-gradient(145deg,#20231b,#151712);padding:22px;min-width:0}.floorhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.floor{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:38px 22px;padding:46px 18px;border:1px solid #373c30;background:repeating-linear-gradient(0deg,transparent,transparent 29px,#ffffff03 30px),repeating-linear-gradient(90deg,transparent,transparent 29px,#ffffff03 30px)}.floor:before{content:'KITCHEN / SERVICE';position:absolute;top:12px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:3px;color:var(--muted)}.floor:after{content:'ENTRANCE ↓';position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:3px;color:var(--muted)}.table{position:relative;min-height:72px;padding:14px 5px;border:1px solid #64745b;background:#313c2a;color:#d1dfc4;border-radius:8px;transition:all .5s}.table:before,.table:after{content:'';position:absolute;left:28%;right:28%;height:5px;border:1px solid #5d6655;border-radius:2px;background:#30342a}.table:before{top:-9px}.table:after{bottom:-9px}.table b{font-size:12px;display:block;letter-spacing:1px}.table span{font-size:9px;display:block;margin-top:6px;opacity:.75}.table.occupied{background:#493b29;border-color:#846940;color:#e9c795}.table.reserved{background:#343743;border-color:#62667e;color:#c1c5df}.table.disabled{background:#242620;border-color:#373b32;color:#71766b}.table.joined{background:#5c4629;border-color:var(--amber);color:var(--amber)}.table.selected,.table.scan{border-color:var(--amber);box-shadow:0 0 0 3px #e9b76a22,0 0 26px #e9b76a15;transform:scale(1.05)}.table.join-left{transform:translateX(12px)}.table.join-right{transform:translateX(-12px)}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px;color:var(--muted);font-size:9px}.legend i{display:inline-block;width:5px;height:5px;margin-right:5px;background:var(--green)}.legend .r{background:#8c91af}.legend .o{background:var(--amber)}.engine{margin-top:20px;padding:14px;border:1px solid var(--line);font:11px monospace;color:var(--amber);min-height:46px}.section{padding:80px 0;border-top:1px solid var(--line)}.story{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}.storycopy article{padding:35px 0 60px;min-height:250px}.sticky{position:sticky;top:25px}.storycopy p{max-width:390px;color:var(--muted)}.split{display:grid;grid-template-columns:1.7fr 1fr;gap:24px}.panel{padding:24px;border:1px solid var(--line);background:var(--panel)}.pagehead{display:flex;justify-content:space-between;align-items:center;padding:45px 0 28px;gap:20px}.pagehead h2{margin:8px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);margin-bottom:25px;border:1px solid var(--line)}.stat{padding:22px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{display:block;font-size:30px;font-weight:500;margin-top:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:17px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.badge{font-size:9px;letter-spacing:1px;padding:6px 8px;background:#99b99715;color:var(--green)}.badge.amber{color:var(--amber);background:#e9b76a15}.inspector h2{font-size:42px}.inspector dl{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:25px 0}.inspector dt{font-size:10px;color:var(--muted)}.inspector dd{margin:5px 0;font-size:13px}.steps{display:flex;gap:10px;margin-bottom:35px}.steps span{flex:1;height:3px;background:var(--line)}.steps .done{background:var(--amber)}.booking{max-width:760px;margin:40px auto}.booking h2{font-size:38px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}.choices button.chosen{border-color:var(--amber);background:#e9b76a15;color:var(--amber)}input,select{width:100%;background:#111310;border:1px solid var(--line);color:var(--text);padding:14px;margin:8px 0 16px;border-radius:0}label{font-size:11px;color:var(--muted)}.summary{padding:18px;background:#e9b76a09;border-left:2px solid var(--amber);line-height:2}.options{display:grid;gap:8px;margin:18px 0}.option{padding:13px;border:1px solid var(--line);transition:.4s}.option.best{border-color:var(--amber);color:var(--amber)}.timeline{overflow:auto}.timehead{margin-left:55px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px;min-width:450px}.trackrow{display:flex;align-items:center;margin-top:18px;min-width:505px}.trackrow>span{width:55px;font-size:10px;color:var(--muted)}.track{height:35px;flex:1;position:relative;background:repeating-linear-gradient(90deg,#ffffff04 0,#ffffff04 1px,transparent 1px,transparent 25%)}.interval{position:absolute;top:2px;height:29px;background:#e9b76a22;border:1px solid #e9b76a70;color:var(--amber);font-size:9px;padding:4px;overflow:hidden;white-space:nowrap}.chart{height:200px;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding-top:20px}.barcol{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}.bar{background:#e9b76a;border-top:2px solid #f7d49e;min-height:2px;animation:grow .6s ease both;transform-origin:bottom}.barcol span{font-size:9px;color:var(--muted);margin-bottom:-22px}.analyticsgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#e9b76a;color:#201b12;padding:14px 22px;z-index:20;max-width:90%;font-size:12px;box-shadow:0 10px 40px #0008}.empty{padding:35px 0;color:var(--muted)}footer{border-top:1px solid var(--line);padding:25px 5%;display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.hidden{display:none!important}.mobilemenu{display:none}.queue-num{font:24px monospace;color:var(--amber);margin-right:18px}.queue-name{flex:1}.queue-name small{display:block;color:var(--muted);margin-top:7px}.progress{height:4px;background:var(--line);margin:14px 0}.progress>i{display:block;height:100%;background:var(--amber)}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@media(max-width:900px){.hero{gap:25px;min-height:600px}h1{letter-spacing:-2px}.story{gap:25px}.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{border-bottom:1px solid var(--line)}nav .links{gap:13px}.table{min-height:65px}.floor{gap:30px 14px;padding:40px 12px}}@media(max-width:620px){nav{flex-wrap:wrap;padding:18px 5%}.mobilemenu{display:block}nav .links{display:none;width:100%;flex-wrap:wrap;padding:10px 0}nav .links.open{display:flex}.hero{grid-template-columns:1fr;padding:45px 0;gap:25px}.hero h1{font-size:52px}.hero p{font-size:13px}.proof{gap:15px}.story{grid-template-columns:1fr}.sticky{position:static;grid-row:1}.storycopy article{min-height:0;padding:25px 0}.section{padding:45px 0}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:16px}.stat b{font-size:25px}.analyticsgrid{grid-template-columns:1fr}.pagehead{align-items:flex-start}.pagehead h2{font-size:26px}.pagehead .actions{margin:0}.choices{grid-template-columns:repeat(2,1fr)}.panel{padding:18px}.floor{gap:32px 15px}.booking{margin:30px auto}.booking h2{font-size:29px}footer{gap:20px}.demo{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style><link rel="stylesheet" href="premium.css"></head><body><nav><a href="#home" class="brand">SMART<i>SEAT</i></a><span class="demo">LOCAL DEMO · NO LIVE BOOKINGS</span><button class="mobilemenu small" aria-label="Toggle navigation" onclick="document.querySelector('.links').classList.toggle('open')">Menu</button><div class="links"><a href="#reserve">Reservations</a><a href="#tables">Tables</a><a href="#waitlist">Waitlist</a><a href="#analytics">Analytics</a><a href="#console" class="small">Restaurant console ↗</a></div></nav><main id="app"></main><footer><span class="brand">SMARTSEAT</span><span>Intelligent hospitality. Thoughtful by design.<br>Local demonstration — data stays in this browser.</span></footer><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const initial={tables:Array.from({length:9},(_,i)=>({id:'T'+String(i+1).padStart(2,'0'),capacity:[2,2,6,2,2,4,2,4,6][i],zone:i>5?'Outdoor':'Indoor',status:i===5?'disabled':i===2||i===7?'occupied':'available',customer:i===2?'Rahul':i===7?'Meera':'',group:null})),reservations:[],waitlist:[{id:1,name:'Arun',guests:4,added:Date.now()-12*60000},{id:2,name:'Priya',guests:2,added:Date.now()-18*60000},{id:3,name:'Karthik',guests:6,added:Date.now()-24*60000}]};
let data;try{data=JSON.parse(localStorage.getItem('smartseat-v1'))||structuredClone(initial)}catch{data=structuredClone(initial)}
let selected='T04',step=0,booking={},candidates=[],choice=null,busy=false,storyObserver,toastTimer;
const $=s=>document.querySelector(s),escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem('smartseat-v1',JSON.stringify(data));const today=()=>new Date().toLocaleDateString('en-CA');const time=n=>{let h=Math.floor(n/60);return `${h%12||12}:${String(n%60).padStart(2,'0')} ${h>=12?'PM':'AM'}`};const toast=s=>{clearTimeout(toastTimer);$('#toast').textContent=s;$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4000)};
function resetBooking(){booking={date:today(),start:1170,guests:4,zone:'Indoor',name:''};step=0;choice=null;candidates=[]}
function blocked(t,date,start){return t.status==='disabled'||((t.status==='occupied'||t.group)&&date===today())||data.reservations.some(r=>r.status!=='completed'&&r.date===date&&r.tables.includes(t.id)&&start<r.start+90&&start+90>r.start)}
function allocate(){const ts=data.tables.filter(t=>t.zone===booking.zone&&!blocked(t,booking.date,booking.start));let opts=ts.filter(t=>t.capacity>=booking.guests).map(t=>({ids:[t.id],capacity:t.capacity}));const joins=[['T01','T02'],['T04','T05'],['T07','T08']];joins.forEach(ids=>{const pair=ids.map(id=>ts.find(t=>t.id===id));if(pair.every(Boolean)&&pair.reduce((s,t)=>s+t.capacity,0)>=booking.guests)opts.push({ids,capacity:pair.reduce((s,t)=>s+t.capacity,0)})});return opts.sort((a,b)=>a.capacity-b.capacity||(a.ids.includes('T04')?-1:b.ids.includes('T04')?1:a.ids.length-b.ids.length))}
function floor(id,mode='inspect'){return `<div class="floorwrap"><div class="floorhead"><span class="label">THE DINING ROOM</span><span class="label"><i class="dot"></i> ${mode==='book'?'RESERVATION PREVIEW':'LOCAL FLOOR'}</span></div><div class="floor" id="${id}">${data.tables.map(t=>{let status=mode==='book'?(blocked(t,booking.date,booking.start)?'disabled':'available'):t.group?'joined':t.status;return `<button title="${t.id} · ${t.capacity} seats · ${status} · ${t.zone}" aria-label="${t.id}, ${t.capacity} seats, ${status}" class="table ${status} ${mode==='inspect'&&selected===t.id?'selected':''}" data-table="${t.id}" onclick="tableClick('${t.id}','${mode}')"><b>${t.id}</b><span>${t.capacity} seats · ${status}</span></button>`}).join('')}</div><div class="legend"><span><i></i>Available</span><span><i class="r"></i>Reserved</span><span><i class="o"></i>Occupied / joined</span><span>Hover or tap to inspect</span></div><div class="engine" id="${id}-engine">${mode==='book'?'ALLOCATOR / Awaiting request':'SEATING ENGINE / Conflict checks enabled'}</div></div>`}
function tableClick(id,mode){if(mode==='book'){const opt=candidates.find(o=>o.ids.includes(id));if(opt){choice=opt;renderBooking()}else toast('No suitable allocation for this table and request.')}else if(mode==='hero'){toast(`${id} · ${data.tables.find(t=>t.id===id).capacity} seats · ${data.tables.find(t=>t.id===id).zone}`)}else{selected=id;render()}}
function home(){return `<section class="hero"><div><div class="eyebrow"><i class="dot"></i> INTELLIGENCE, AT YOUR TABLE</div><h1>Every table.<br>Every reservation.<br><em>Optimized.</em></h1><p>An intelligent seating engine that coordinates reservations, walk-ins and dynamic table combinations in real time.</p><div class="actions"><a class="primary" style="padding:14px 20px" href="#reserve">Reserve a table ↗</a><a href="#console" style="padding:14px 0">Open restaurant console →</a></div><div class="proof"><span>01 / Interval-aware</span><span>02 / Dynamic grouping</span><span>03 / Less wasted space</span></div></div><div>${floor('hero-floor','hero')}<div class="actions"><button class="small" onclick="demoUnion('hero-floor')">Watch the seating engine →</button></div></div></section><section class="section story"><div class="storycopy">${[['Reservations are more than a calendar.','Each booking is a time interval. SmartSeat checks every selected table before it accepts a reservation.'],["Tables shouldn’t sit empty.",'Match party size to available capacity, rather than assigning the first table you see.'],['Two tables can become one.','Adjacent tables join as one seating group. Checkout releases the entire group together.'],['Every reservation has an interval.','Time overlap checks keep a 7:30 dinner from colliding with the next booking.'],['The best arrangement, calculated.','Compare feasible tables and adjacent pairs, then minimize unused seats.']].map((a,i)=>`<article data-story="${i}"><div class="label">0${i+1} / THE SEATING SYSTEM</div><h2>${a[0]}</h2><p>${a[1]}</p></article>`).join('')}</div><div class="sticky">${floor('story-floor','hero')}<div class="panel" style="margin-top:20px"><div class="label">RESERVATION INTELLIGENCE</div>${timeline(true)}</div></div></section><section class="section"><div class="label">BUILT FOR THE EVENING RUSH</div><h2>A calmer service.<br>A smarter dining room.</h2><div class="actions"><a href="#reserve" class="primary" style="padding:14px 20px">Try a reservation →</a><a href="#console" style="padding:14px 20px">Explore the console →</a></div></section>`}
function stats(){const occupied=data.tables.filter(t=>t.status==='occupied').length,available=data.tables.filter(t=>t.status==='available'&&!t.group).length,active=data.reservations.filter(r=>r.status!=='completed').length;return `<div class="stats">${[['ACTIVE RESERVATIONS',active],['OCCUPIED TABLES',occupied],['AVAILABLE NOW',available],['WAITLIST',data.waitlist.length],['TABLE UTILIZATION',Math.round(occupied/8*100)+'%']].map(([a,b])=>`<div class="stat"><span class="label">${a}</span><b>${b}</b></div>`).join('')}</div>`}
function inspector(){const t=data.tables.find(t=>t.id===selected),r=data.reservations.find(r=>r.status!=='completed'&&r.tables.includes(t.id)),group=t.group||[t.id];return `<aside class="panel inspector"><div class="label">TABLE INSPECTOR</div><h2>${group.join(' + ')}</h2><span class="badge ${t.status==='occupied'?'amber':''}">${t.status.toUpperCase()}</span><dl><div><dt>CAPACITY</dt><dd>${group.reduce((s,id)=>s+data.tables.find(x=>x.id===id).capacity,0)} seats</dd></div><div><dt>LOCATION</dt><dd>${t.zone}</dd></div><div><dt>CUSTOMER</dt><dd>${escape(r?.name||t.customer||'—')}</dd></div><div><dt>PARTY</dt><dd>${r?r.guests+' guests':'—'}</dd></div><div><dt>ARRIVAL</dt><dd>${r?time(r.start):t.status==='occupied'?'Demo occupied':'—'}</dd></div><div><dt>EXPECTED DEPARTURE</dt><dd>${r?time(r.start+90):'—'}</dd></div></dl><div class="actions">${t.status==='occupied'?`<button class="primary" onclick="checkout('${t.id}')">Check out →</button>`:''}${t.status==='reserved'?`<button class="primary" onclick="arrive('${t.id}')">Mark arrived</button>`:''}${t.status==='available'&&!t.group?`<button onclick="walkin('${t.id}')">Seat walk-in</button><button onclick="joinTable('${t.id}')">Join adjacent table</button>`:''}${t.group&&t.status!=='occupied'?`<button onclick="checkout('${t.id}')">Release group</button>`:''}${t.status==='disabled'?'<span class="muted">Unavailable: service station.</span>':''}</div>${r?`<div class="summary">Reservation #${r.id}<br>${escape(r.date)} · ${time(r.start)}–${time(r.start+90)}</div>`:''}<p class="muted" style="font-size:11px">Physical occupancy is separate from future booking availability. All actions affect local demo data only.</p></aside>`}
function consoleView(){return `<div class="pagehead"><div><div class="label">SMARTSEAT / RESTAURANT CONSOLE</div><h2>The evening, in view.</h2></div><div><i class="dot"></i> <span class="muted">Local demo service</span></div></div>${stats()}<div class="split"><div>${floor('console-floor')}<div class="panel" style="margin-top:24px"><div class="label">UPCOMING & ACTIVE RESERVATIONS</div>${reservationList()}</div></div>${inspector()}</div><section class="section"><div class="label">RESERVATION INTELLIGENCE</div><h2>No overlapping bookings.</h2>${timeline()}</section>`}
function reservationList(){const rs=data.reservations.filter(r=>r.status!=='completed');return rs.length?rs.map(r=>`<div class="row"><div><b>${escape(r.name)}</b><p class="muted" style="margin:3px 0;font-size:11px">${escape(r.date)} · ${time(r.start)} · ${r.guests} guests · ${r.tables.join(' + ')}</p></div><span class="badge">${r.status}</span></div>`).join(''):'<div class="empty">No reservations yet. <a href="#reserve" style="color:var(--amber)">Create your first →</a></div>'}
function timeline(demo=false){const sample=[{tables:['T01'],start:1080,name:'Demo booking',guests:2,id:'D01'},{tables:['T03'],start:1140,name:'Demo booking',guests:6,id:'D02'},{tables:['T04','T05'],start:1170,name:'Demo booking',guests:4,id:'D03'}],rs=demo?sample:data.reservations.filter(r=>r.date===today()&&r.status!=='completed');return `<div class="timeline"><p class="muted" style="font-size:11px">${demo?'Illustrative intervals':'Today’s saved bookings'} · 90-minute dining windows · endpoint overlap is allowed</p><div class="timehead"><span>5 PM</span><span>6:30 PM</span><span>8 PM</span><span>9:30 PM</span><span>11 PM</span></div>${data.tables.filter(t=>t.status!=='disabled').map(t=>`<div class="trackrow"><span>${t.id}</span><div class="track">${rs.filter(r=>r.tables.includes(t.id)).map(r=>`<button class="interval" style="left:${(r.start-1020)/360*100}%;width:25%" title="Reservation #${r.id} · ${escape(r.name)} · ${r.guests} guests · ${time(r.start)}–${time(r.start+90)} · ${r.tables.join(' + ')}" onclick="toast(this.title)">${time(r.start)}</button>`).join('')}</div></div>`).join('')}</div>`}
function renderBooking(){const names=['Date','Time','Guests','Preference','Table','Confirmation'];const content=[`<h2>Choose your evening.</h2><p class="muted">A table worth looking forward to.</p><label for="date">RESERVATION DATE</label><input type="date" id="date" min="${today()}" value="${booking.date}" onchange="booking.date=this.value">`,`<h2>When should we expect you?</h2><p class="muted">Every reservation includes a 90-minute dining window.</p><div class="choices">${[1020,1050,1080,1110,1140,1170,1200,1230,1260].map(n=>`<button class="${booking.start===n?'chosen':''}" onclick="booking.start=${n};renderBooking()">${time(n)}</button>`).join('')}</div>`,`<h2>Good company. Perfect fit.</h2><p class="muted">How many guests are joining you?</p><div class="choices">${[1,2,3,4,5,6,7,8].map(n=>`<button class="${booking.guests===n?'chosen':''}" onclick="booking.guests=${n};renderBooking()">${n} ${n===1?'guest':'guests'}</button>`).join('')}</div>`,`<h2>Set the atmosphere.</h2><p class="muted">Choose the dining room or the open-air terrace.</p><div class="choices">${['Indoor','Outdoor'].map(z=>`<button class="${booking.zone===z?'chosen':''}" onclick="booking.zone='${z}';renderBooking()">${z}<span style="display:block;font-size:11px;margin-top:10px">${z==='Indoor'?'Warm & intimate':'Fresh & relaxed'}</span></button>`).join('')}</div>`,`<h2>${busy?'Finding the best table…':choice?'Your best match.':'Let’s find your seat.'}</h2><div class="summary">${booking.guests} guests · ${booking.zone} · ${time(booking.start)}–${time(booking.start+90)}<br>${escape(booking.date)}</div><div style="margin-top:24px">${floor('booking-floor','book')}</div><div class="options">${candidates.map((c,i)=>`<button class="option ${choice===c?'best':''}" onclick="choose(${i})">${c.ids.join(' + ')} · ${c.capacity} seats · ${Math.round(booking.guests/c.capacity*100)}% efficiency ${choice===c?' / RECOMMENDED':''}</button>`).join('')}</div>${!busy&&!candidates.length?'<p class="muted">No suitable table at this time. Try another time, date or seating area.</p>':''}`,`<h2>A place for your evening.</h2><div class="summary">${choice?.ids.join(' + ')||''}<br>${booking.guests} guests · ${booking.zone}<br>${escape(booking.date)} · ${time(booking.start)}–${time(booking.start+90)}<br>${choice?Math.round(booking.guests/choice.capacity*100):0}% capacity efficiency</div><div style="margin-top:25px"><label for="guestname">GUEST NAME</label><input id="guestname" maxlength="80" placeholder="Your name" value="${escape(booking.name)}" oninput="booking.name=this.value"><p class="muted" style="font-size:11px">This is a local demonstration. No reservation is sent to a restaurant.</p></div>`][step];$('#app').innerHTML=`<div class="view booking"><div class="label">RESERVATION / ${step+1} OF 6 · ${names[step]}</div><div class="steps" style="margin-top:15px">${names.map((_,i)=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div>${content}<div class="actions">${step>0?'<button onclick="previous()" '+(busy?'disabled':'')+'>← Back</button>':'<a href="#home" style="padding:14px">← Home</a>'}<button class="primary" onclick="next()" ${busy||step===4&&!choice?'disabled':''}>${step===5?'Confirm local reservation':step===3?'Find my table →':'Continue →'}</button></div></div>`}
function choose(i){choice=candidates[i];renderBooking()}function previous(){step--;renderBooking()}
async function next(){if(step===0&&(!booking.date||booking.date<today()))return toast('Choose today or a future date.');if(step===5)return confirmReservation();step++;if(step===4){busy=true;candidates=allocate();choice=null;renderBooking();for(let i=0;i<candidates.length;i++){if(location.hash!=='#reserve'){busy=false;return}const c=candidates[i];$('#booking-floor-engine').textContent=`EVALUATING / ${c.ids.join(' + ')} / ${c.capacity} seats / ${Math.round(booking.guests/c.capacity*100)}%`;document.querySelectorAll('#booking-floor .table').forEach(t=>t.classList.toggle('scan',c.ids.includes(t.dataset.table)));await delay(400)}choice=candidates[0]||null;busy=false;renderBooking();if(choice){choice.ids.forEach(id=>$('#booking-floor [data-table="'+id+'"]').classList.add('selected'));$('#booking-floor-engine').textContent=`BEST FIT / ${choice.ids.length>1?'UNION('+choice.ids.join(', ')+')':choice.ids[0]} / ${Math.round(booking.guests/choice.capacity*100)}% EFFICIENCY`;if(choice.ids.length>1){$('#booking-floor [data-table="'+choice.ids[0]+'"]').classList.add('join-left');$('#booking-floor [data-table="'+choice.ids[1]+'"]').classList.add('join-right')}}}else renderBooking()}
function confirmReservation(){if(!booking.name.trim())return toast('Please enter a guest name.');if(!choice||choice.ids.some(id=>blocked(data.tables.find(t=>t.id===id),booking.date,booking.start)))return toast('This allocation is no longer available. Go back and search again.');const r={id:Date.now(),name:booking.name.trim(),guests:booking.guests,date:booking.date,start:booking.start,tables:choice.ids,status:'reserved'};data.reservations.push(r);if(r.date===today())r.tables.forEach(id=>data.tables.find(t=>t.id===id).status='reserved');save();$('#app').innerHTML=`<section class="booking panel view"><div class="label">LOCAL RESERVATION CONFIRMED</div><h2>See you at the table,<br>${escape(r.name)}.</h2><div class="summary">${r.tables.join(' + ')} · ${r.guests} guests<br>${escape(r.date)} · ${time(r.start)}–${time(r.start+90)}<br>Reference #${r.id}</div><p class="muted">Saved in this browser only. This is not a real restaurant booking.</p><div class="actions"><a href="#console" class="primary" style="padding:14px">View in console →</a><button onclick="resetBooking();renderBooking()">New reservation</button></div></section>`}
const delay=ms=>new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion: reduce)').matches?0:ms));
async function demoUnion(id){const f=document.getElementById(id);if(!f||f.dataset.busy)return;f.dataset.busy='1';const eng=document.getElementById(id+'-engine');for(const ids of [['T01','T02'],['T03'],['T04','T05']]){f.querySelectorAll('.table').forEach(t=>t.classList.toggle('scan',ids.includes(t.dataset.table)));eng.textContent=`EVALUATING / ${ids.join(' + ')} / ${ids[0]==='T03'?'67':'100'}% EFFICIENCY`;await delay(550);if(!f.isConnected)return}eng.textContent='UNION(T04, T05) → 4 SEATS / 100% CAPACITY EFFICIENCY';f.querySelector('[data-table="T04"]').classList.add('join-left');f.querySelector('[data-table="T05"]').classList.add('join-right');await delay(1700);f.querySelectorAll('.table').forEach(t=>t.classList.remove('scan','join-left','join-right'));eng.textContent='CHECKOUT → GROUP RELEASED / DEMO ONLY';delete f.dataset.busy}
function arrive(id){const r=data.reservations.find(r=>r.tables.includes(id)&&r.status==='reserved');if(!r||r.date!==today())return toast('Only today’s reservations can be seated.');r.status='occupied';r.tables.forEach(tid=>{const t=data.tables.find(t=>t.id===tid);t.status='occupied';t.customer=r.name;t.group=r.tables.length>1?r.tables:null});save();render();toast('Guests seated. Table state updated.')}
function checkout(id){const t=data.tables.find(t=>t.id===id),ids=t.group||[id];ids.forEach(tid=>{const x=data.tables.find(t=>t.id===tid);x.status='available';x.customer='';x.group=null});data.reservations.filter(r=>r.status==='occupied'&&r.tables.some(tid=>ids.includes(tid))).forEach(r=>r.status='completed');save();render();const w=data.waitlist.find(w=>allocateFor(w.guests).length);toast(w?`Table released. ${w.name} can now be seated from the waitlist.`:'Table released and ready for service.')}
function allocateFor(guests){const old=booking;booking={date:today(),start:new Date().getHours()*60+new Date().getMinutes(),guests,zone:'Indoor'};const out=allocate();booking=old;return out}
function walkin(id){const t=data.tables.find(t=>t.id===id);if(blocked(t,today(),new Date().getHours()*60+new Date().getMinutes()))return toast('This table conflicts with an active or upcoming reservation.');t.status='occupied';t.customer='Walk-in';save();render();toast('Walk-in seated.')}function joinTable(id){const pair=[['T01','T02'],['T04','T05'],['T07','T08']].find(p=>p.includes(id));if(!pair)return toast('No joinable adjacent table.');if(pair.some(tid=>blocked(data.tables.find(t=>t.id===tid),today(),new Date().getHours()*60+new Date().getMinutes())))return toast('Both tables must be free for the next 90 minutes.');pair.forEach(tid=>data.tables.find(t=>t.id===tid).group=pair);save();render();toast('UNION('+pair.join(', ')+') — table group created.')}
function waitlist(){return `<div class="pagehead"><div><div class="label">THE NEXT GREAT EVENING</div><h2>Waiting, thoughtfully.</h2></div><span class="badge">${data.waitlist.length} PARTIES IN QUEUE</span></div><div class="split"><div class="panel">${data.waitlist.length?data.waitlist.map((w,i)=>{const can=allocateFor(w.guests).length>0;return `<div class="row"><span class="queue-num">${String(i+1).padStart(2,'0')}</span><div class="queue-name"><b>${escape(w.name)}</b><small>${w.guests} guests · ${Math.max(0,Math.floor((Date.now()-w.added)/60000))} min waiting</small></div><button class="small ${can?'primary':''}" onclick="seatWait(${w.id})" ${can?'':'disabled'}>${can?'Table ready →':'Waiting'}</button><button class="small" aria-label="Remove ${escape(w.name)}" onclick="removeWait(${w.id})">×</button></div>`}).join(''):'<div class="empty">Everyone is seated. The queue is clear.</div>'}<p class="muted" style="font-size:11px">FIFO among suitable parties. Indoor walk-ins only; upcoming 90-minute conflicts are checked.</p></div><form class="panel" onsubmit="addWait(event)"><div class="label">ADD A WALK-IN</div><h2>Make room for company.</h2><label for="waitname">GUEST NAME</label><input required id="waitname" maxlength="80" placeholder="Guest name"><label for="waitguests">PARTY SIZE</label><select id="waitguests">${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}">${n} guests</option>`).join('')}</select><button class="primary" type="submit">Add to waitlist →</button></form></div>`}
function addWait(e){e.preventDefault();data.waitlist.push({id:Date.now(),name:$('#waitname').value.trim(),guests:Number($('#waitguests').value),added:Date.now()});save();render();toast('Party added to the queue.')}
function removeWait(id){data.waitlist=data.waitlist.filter(w=>w.id!==id);save();render()}
function seatWait(id){const w=data.waitlist.find(w=>w.id===id),eligible=data.waitlist.find(x=>allocateFor(x.guests).length);if(!w||!eligible)return;if(eligible.id!==id)return toast(`Seat ${eligible.name} first — the earliest suitable party.`);const c=allocateFor(w.guests)[0];const r={id:Date.now(),name:w.name,guests:w.guests,date:today(),start:new Date().getHours()*60+new Date().getMinutes(),tables:c.ids,status:'occupied'};data.reservations.push(r);c.ids.forEach(id=>{const t=data.tables.find(t=>t.id===id);t.status='occupied';t.customer=w.name;t.group=c.ids.length>1?c.ids:null});data.waitlist=data.waitlist.filter(x=>x.id!==w.id);save();render();toast(`${w.name} seated at ${c.ids.join(' + ')}.`)}
function bars(values,labels){const max=Math.max(...values,1);return `<div class="chart">${values.map((v,i)=>`<div class="barcol" title="${escape(labels[i])}: ${v}"><div class="bar" style="height:${v/max*85}%;animation-delay:${i*40}ms"></div><span>${labels[i]}</span></div>`).join('')}</div>`}
function analytics(){const rs=data.reservations,eff=rs.length?Math.round(rs.reduce((s,r)=>s+r.guests/r.tables.reduce((n,id)=>n+data.tables.find(t=>t.id===id).capacity,0),0)/rs.length*100):0;return `<div class="pagehead"><div><div class="label">SERVICE INTELLIGENCE</div><h2>The shape of your service.</h2></div><span class="badge">BROWSER-LOCAL DATA</span></div>${stats()}<div class="analyticsgrid"><div class="panel"><div class="label">RESERVATIONS BY START HOUR / SAVED DATA</div><h2>${rs.length} reservations</h2>${bars([17,18,19,20,21].map(h=>rs.filter(r=>Math.floor(r.start/60)===h).length),['5 PM','6 PM','7 PM','8 PM','9 PM'])}<p style="margin-top:42px" class="muted">Counts from reservations created in this browser.</p></div><div class="panel"><div class="label">ALLOCATION EFFICIENCY / SAVED DATA</div><h2>${eff}% capacity fit</h2><p class="muted">Average requested seats divided by allocated seats. No bookings means no efficiency result yet.</p>${data.tables.filter(t=>t.status!=='disabled').map(t=>{const n=rs.filter(r=>r.tables.includes(t.id)).length;return `<div class="row"><span>${t.id} / ${t.capacity} seats</span><span class="muted">${n} bookings</span></div>`}).join('')}</div><div class="panel"><div class="label">ILLUSTRATIVE DEMO / OCCUPANCY PROFILE</div><h2>An evening’s rhythm.</h2>${bars([20,38,65,88,92,74,45],['5','6','7','8','9','10','11'])}<p class="muted" style="margin-top:42px">Illustrative percentages, not measured restaurant statistics.</p></div><div class="panel"><div class="label">WHAT WE MEASURE</div><h2>Useful. Not invented.</h2><div class="row"><span>Dining window</span><b>90 min configured</b></div><div class="row"><span>Waiting parties</span><b>${data.waitlist.length}</b></div><div class="row"><span>Completed bookings</span><b>${rs.filter(r=>r.status==='completed').length}</b></div><p class="muted">Cancellation rate, measured dining duration and historical wait averages require a connected backend and timestamped events. This demo does not claim those metrics.</p><button onclick="exportData()">Export local data ↓</button></div></div>`}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='smartseat-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){storyObserver?.disconnect();const route=location.hash.slice(1)||'home';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+route));$('.links').classList.remove('open');if(route==='reserve'){if(!booking.date)resetBooking();renderBooking();return}$('#app').innerHTML='<div class="view">'+(route==='home'?home():route==='console'||route==='tables'?consoleView():route==='waitlist'?waitlist():route==='analytics'?analytics():home())+'</div>';if(route==='home'){storyObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const n=+e.target.dataset.story;const el=$('#story-floor-engine');if(el)el.textContent=['INTERVAL SEARCH / Booking conflict checks','CAPACITY MATCH / Minimize unused seats','UNION(T04, T05) / Dynamic table grouping','OVERLAP CHECK / [start, end) intervals','OPTIMAL FIT / Best available capacity'][n];if(n===2||n===4)demoUnion('story-floor')}}),{threshold:.5});document.querySelectorAll('[data-story]').forEach(e=>storyObserver.observe(e))}}
window.addEventListener('hashchange',()=>{busy=false;render();window.scrollTo(0,0)});resetBooking();render();
</script><script src="intelligence.js"></script></body></html>
